
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BmoreCorny | Reset Password</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101114;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(400px, calc(100% - 40px));
      background: #191a1f;
      border: 1px solid #303137;
      border-radius: 12px;
      padding: 28px;
    }
    h1 { color: #f4bd35; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      background: #101114;
      border: 1px solid #41434c;
      border-radius: 7px;
      color: white;
    }
    button {
      margin-top: 20px;
      padding: 13px;
      width: 100%;
      background: #f4bd35;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <h1>🌽 Reset Password</h1>
  <p>Choose a new password for your BmoreCorny account.</p>

  <form id="resetForm">
    <label for="password">New Password</label>
    <input id="password" type="password" minlength="8"
      autocomplete="new-password" required>

    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" minlength="8"
      autocomplete="new-password" required>

    <button id="submitButton" type="submit">Save New Password</button>
  </form>

  <div id="message"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
(async function () {
  const message = document.getElementById("message");
  const form = document.getElementById("resetForm");
  const button = document.getElementById("submitButton");

  if (!window.BMORECORNY_CONFIG) {
    message.textContent = "Configuration could not be loaded.";
    return;
  }

  const db = window.supabase.createClient(
    window.BMORECORNY_CONFIG.SUPABASE_URL,
    window.BMORECORNY_CONFIG.SUPABASE_ANON_KEY
  );

  const { data: { session }, error } = await db.auth.getSession();

  if (error || !session) {
    message.textContent =
      "Recovery session not found. Request a fresh password-reset email.";
    form.hidden = true;
    return;
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmation =
      document.getElementById("confirmPassword").value;

    if (password !== confirmation) {
      message.textContent = "Passwords do not match.";
      return;
    }

    button.disabled = true;
    message.textContent = "Updating password...";

    const { error } = await db.auth.updateUser({ password });

    button.disabled = false;

    if (error) {
      message.textContent = "Password update failed: " + error.message;
      return;
    }

    message.textContent =
      "Password updated successfully! You can now sign in to Event Management.";

    form.hidden = true;
  });
})();
</script>
</body>
</html>
