
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Hub | BmoreCorny</title>
  <meta name="description" content="Your BmoreCorny event hub. Get the details, claim your spot, and be part of the action.">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin/config.js"></script>

  <style>
    .hub {
      max-width: 950px;
      margin: 0 auto;
      padding: 45px 22px 80px;
      color: #fff;
    }
    .hub-hero {
      background: #171717;
      border: 1px solid #363636;
      border-radius: 18px;
      padding: 38px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .hub-eyebrow {
      color: #f5b82e;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }
    .hub h1 {
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.08;
      margin: 0 0 18px;
      color: #fff;
    }
    .hub-description {
      color: #c7c7c7;
      line-height: 1.7;
      margin: 0;
    }
    .hub-status {
      display: inline-block;
      margin-top: 22px;
      padding: 7px 12px;
      border-radius: 30px;
      background: #303030;
      color: #ddd;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .hub-status.open {
      background: #183d2a;
      color: #8ee0a9;
    }
    .hub-status.live {
      background: #3c2020;
      color: #ffaaaa;
    }
    .hub-status.registered {
      background: #3c3215;
      color: #ffd66e;
    }
    .hub-panel {
      background: #191919;
      border: 1px solid #363636;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 18px;
    }
    .hub-panel h2 {
      margin: 0 0 19px;
      color: #f5b82e;
      font-size: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .hub-detail {
      padding: 13px 0;
      border-bottom: 1px solid #333;
    }
    .hub-detail:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .hub-detail-label {
      color: #929292;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .hub-detail-value {
      color: #fff;
      font-size: 16px;
      line-height: 1.5;
    }
    .hub-action {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 9px;
      background: #f5b82e;
      color: #171717;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .8px;
      cursor: pointer;
    }
    .hub-action.secondary {
      background: #333;
      color: #fff;
    }
    .hub-action:disabled {
      opacity: .55;
      cursor: wait;
    }
    .hub-verify-link {
      display: inline-block;
      margin-top: 17px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #f5b82e;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .hub-verify-link:hover {
      color: #ffda79;
    }
    .hub-verify-link:disabled {
      opacity: .55;
      cursor: wait;
    }
    .hub-message {
      display: none;
      padding: 15px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
      background: #202020;
      border: 1px solid #383838;
      color: #ccc;
      line-height: 1.5;
    }
    .hub-message.show {
      display: block;
    }
    .hub-message.error {
      border-color: #874343;
      color: #ffb6b6;
    }
    .hub-message.success {
      border-color: #39764c;
      color: #a5e6b6;
    }
    .hub-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 35px;
      padding-top: 22px;
      border-top: 1px solid #333;
      font-size: 13px;
    }
    .hub-links a {
      color: #f5b82e;
      text-decoration: none;
      font-weight: 800;
    }
    .hub-loading {
      padding: 30px;
      text-align: center;
      color: #bbb;
      background: #191919;
      border: 1px solid #363636;
      border-radius: 14px;
    }
    .hub-artwork {
      display: block;
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 12px;
      margin: 0 0 25px;
      border: 1px solid #363636;
      background: #101010;
    }
    .hub-rich-text {
      color: #ddd;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .hub-external-link {
      margin-top: 18px;
    }
    .hub-empty {
      color: #929292;
      font-size: 14px;
      line-height: 1.6;
    }
    @media (max-width: 600px) {
      .hub {
        padding: 25px 15px 55px;
      }
      .hub-hero {
        padding: 28px 22px;
      }
      .hub-panel {
        padding: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="hub">
    <section id="eventContent" class="hub-loading">
      Loading event...
    </section>

    <div id="hubMessage" class="hub-message" role="status" aria-live="polite"></div>

    <nav class="hub-links">
      <a href="events.html">← ALL EVENTS</a>
      <a href="passport.html">CORNSTAR PASSPORT ↗</a>
      <a href="hall-of-drain.html">HALL OF DRAIN ↗</a>
      <a href="index.html">BMORECORNY HOME ↗</a>
    </nav>
  </main>

  <script>
    (() => {
      const config = window.BMORECORNY_CONFIG;
      const content = document.getElementById("eventContent");
      const messageBox = document.getElementById("hubMessage");

      let client;
      let eventRecord;
      let currentUser = null;
      let participantId = null;
      let attendance = null;

      const eventId = new URLSearchParams(window.location.search).get("id");

      const REGISTERABLE_STATUSES = [
        "published",
        "registration_open",
        "in_progress"
      ];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[character]);
      }

      function safeExternalUrl(value) {
        if (!value) return null;

        try {
          const url = new URL(value);
          if (url.protocol === "https:" || url.protocol === "http:") {
            return url.href;
          }
        } catch (error) {
          return null;
        }

        return null;
      }

      function showMessage(message, type = "") {
        messageBox.textContent = message;
        messageBox.className = "hub-message show " + type;
      }

      function formatDate(value) {
        if (!value) return "To be announced";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "To be announced";

        return date.toLocaleString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function formatType(value) {
        if (!value) return "BmoreCorny Event";

        return value.replaceAll("_", " ")
          .replace(/\b\w/g, letter => letter.toUpperCase());
      }

      function locationText() {
        const parts = [
          eventRecord.venue_name,
          [eventRecord.city, eventRecord.state].filter(Boolean).join(", ")
        ].filter(Boolean);

        return parts.length ? parts.join(" • ") : "Location to be announced";
      }

      function statusText() {
        if (attendance?.attendance_status === "registered") return "You're Registered";
        if (attendance?.attendance_status === "checked_in") return "Checked In";
        if (attendance?.attendance_status === "attended") return "Attendance Recorded";

        const labels = {
          published: "Registration Available",
          registration_open: "Registration Open",
          in_progress: "Event In Progress",
          completed: "Event Completed",
          cancelled: "Event Cancelled"
        };

        return labels[eventRecord.status] || eventRecord.status;
      }

      function renderPage() {
        const canRegister = REGISTERABLE_STATUSES.includes(eventRecord.status);
        const isLive = eventRecord.status === "in_progress";
        const isRegistered = attendance?.attendance_status === "registered";
        const isCheckedIn = ["checked_in", "attended"].includes(attendance?.attendance_status);
        const hasActiveRegistration = isRegistered || isCheckedIn;

        let statusClass = "";
        if (["published", "registration_open"].includes(eventRecord.status)) {
          statusClass = "open";
        }
        if (isLive) statusClass = "live";
        if (hasActiveRegistration) statusClass = "registered";

        let action = "";

        if (isRegistered) {
          action = `
            <button class="hub-action secondary" id="cancelButton">
              CANCEL REGISTRATION
            </button>
          `;
        } else if (isCheckedIn) {
          action = `
            <button class="hub-action secondary" disabled>
              REGISTRATION CONFIRMED
            </button>
          `;
        } else if (canRegister && !currentUser) {
          action = `
            <a class="hub-action" href="signup.html">
              SIGN IN TO REGISTER
            </a>
          `;
        } else if (canRegister && !participantId) {
          action = `
            <a class="hub-action" href="signup.html">
              CLAIM YOUR CORNSTAR PASSPORT
            </a>
          `;
        } else if (canRegister) {
          action = `
            <button class="hub-action" id="registerButton">
              REGISTER FOR THIS EVENT
            </button>
          `;
        } else {
          action = `
            <button class="hub-action secondary" disabled>
              ${isLive ? "EVENT IN PROGRESS" : "REGISTRATION NOT OPEN"}
            </button>
          `;
        }

        const verifyLink = hasActiveRegistration ? `
          <button class="hub-verify-link" id="verifyRegistrationButton">
            VERIFY MY REGISTRATION ↗
          </button>
        ` : "";

        const externalRegistrationUrl = safeExternalUrl(eventRecord.registration_url);
        const imageUrl = safeExternalUrl(eventRecord.event_image_url);

        const artwork = imageUrl ? `
          <img
            class="hub-artwork"
            src="${escapeHTML(imageUrl)}"
            alt="${escapeHTML(eventRecord.event_name)} event artwork"
            loading="eager"
            onerror="this.style.display='none';"
          >
        ` : "";

        const description = eventRecord.public_description?.trim()
          ? `
            <section class="hub-panel">
              <h2>About This Event</h2>
              <div class="hub-rich-text">${escapeHTML(eventRecord.public_description)}</div>
            </section>
          `
          : "";

        const attendeeInformation = eventRecord.attendee_information?.trim()
          ? `
            <section class="hub-panel">
              <h2>Attendee Information</h2>
              <div class="hub-rich-text">${escapeHTML(eventRecord.attendee_information)}</div>
            </section>
          `
          : "";

        const externalRegistration = externalRegistrationUrl ? `
          <div class="hub-external-link">
            <a
              class="hub-action"
              href="${escapeHTML(externalRegistrationUrl)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              EXTERNAL TICKETS / REGISTRATION ↗
            </a>
          </div>
        ` : "";

        content.className = "";
        content.innerHTML = `
          <section class="hub-hero">
            <div class="hub-eyebrow">BmoreCorny • Event Hub</div>
            ${artwork}
            <h1>${escapeHTML(eventRecord.event_name)}</h1>
            <p class="hub-description">
              ${eventRecord.public_description?.trim()
                ? escapeHTML(eventRecord.public_description)
                : "Get the details, claim your spot, and be part of the action. Be there. Or be OTW."}
            </p>
            <span class="hub-status ${statusClass}">
              ${escapeHTML(statusText())}
            </span>
          </section>

          ${description}

          <section class="hub-panel">
            <h2>Event Details</h2>

            <div class="hub-detail">
              <div class="hub-detail-label">Event Type</div>
              <div class="hub-detail-value">${escapeHTML(formatType(eventRecord.event_type))}</div>
            </div>

            <div class="hub-detail">
              <div class="hub-detail-label">Date & Time</div>
              <div class="hub-detail-value">${escapeHTML(formatDate(eventRecord.start_at))}</div>
            </div>

            ${eventRecord.end_at ? `
              <div class="hub-detail">
                <div class="hub-detail-label">End Time</div>
                <div class="hub-detail-value">${escapeHTML(formatDate(eventRecord.end_at))}</div>
              </div>
            ` : ""}

            <div class="hub-detail">
              <div class="hub-detail-label">Location</div>
              <div class="hub-detail-value">${escapeHTML(locationText())}</div>
            </div>

            ${externalRegistration}
          </section>

          ${attendeeInformation}

          <section class="hub-panel">
            <h2>Your Spot</h2>
            <p class="hub-description" style="margin-bottom:20px">
              ${currentUser
                ? participantId
                  ? attendance
                    ? "Your Cornstar Passport is connected to this event."
                    : "Your passport is ready. Claim your spot while registration is available."
                  : "You're signed in, but still need to claim your Cornstar Passport."
                : "Sign in or create your Cornstar Passport to register for this event."}
            </p>
            ${action}
            ${verifyLink}
          </section>
        `;

        const registerButton = document.getElementById("registerButton");
        if (registerButton) {
          registerButton.addEventListener("click", register);
        }

        const cancelButton = document.getElementById("cancelButton");
        if (cancelButton) {
          cancelButton.addEventListener("click", cancel);
        }

        const verifyButton = document.getElementById("verifyRegistrationButton");
        if (verifyButton) {
          verifyButton.addEventListener("click", verifyRegistration);
        }

        document.title = eventRecord.event_name + " | BmoreCorny Event Hub";

        const metaDescription = document.querySelector('meta[name="description"]');
        if (metaDescription && eventRecord.public_description) {
          metaDescription.content = eventRecord.public_description.slice(0, 155);
        }
      }

      async function loadEvent() {
        const { data, error } = await client
          .from("events")
          .select(`
            id,
            event_name,
            event_type,
            venue_name,
            city,
            state,
            start_at,
            end_at,
            status,
            public_description,
            attendee_information,
            event_image_url,
            registration_url
          `)
          .eq("id", eventId)
          .maybeSingle();

        if (error) throw error;
        if (!data) throw new Error("We couldn't find that event.");

        eventRecord = data;
      }

      async function loadPlayer() {
        participantId = null;
        attendance = null;

        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError) throw sessionError;

        currentUser = sessionData?.session?.user || null;
        if (!currentUser) return;

        const { data, error } = await client.rpc("get_my_passport");

        if (error) {
          const message = (error.message || "").toLowerCase();

          if (
            error.code === "P0001" ||
            message.includes("no active player profile linked")
          ) {
            return;
          }

          throw error;
        }

        participantId = data?.profile?.participant_id || null;
        if (!participantId) return;

        const { data: records, error: attendanceError } = await client
          .from("event_attendance")
          .select("id,event_id,attendance_status")
          .eq("event_id", eventId)
          .eq("participant_id", participantId)
          .maybeSingle();

        if (attendanceError) throw attendanceError;

        attendance = records || null;
      }

      async function verifyRegistration() {
        const button = document.getElementById("verifyRegistrationButton");
        if (!button) return;

        button.disabled = true;
        button.textContent = "VERIFYING...";

        try {
          await loadPlayer();

          if (!currentUser) {
            showMessage("Please sign in to verify your registration.", "error");
          } else if (!participantId) {
            showMessage("No active Cornstar Passport is linked to this account.", "error");
          } else if (!attendance) {
            showMessage("No registration was found for this event on your Cornstar Passport.", "error");
          } else {
            const status = attendance.attendance_status;

            const confirmations = {
              registered: "Registration verified! You're officially on the attendee list.",
              checked_in: "Registration verified! You're checked in for this event.",
              attended: "Registration verified! Your attendance has been recorded.",
              cancelled: "This registration was cancelled. You are not currently registered."
            };

            showMessage(
              confirmations[status] || "A registration record was found with status: " + status + ".",
              ["registered", "checked_in", "attended"].includes(status) ? "success" : "error"
            );
          }

          renderPage();
        } catch (error) {
          showMessage("We couldn't verify your registration: " + error.message, "error");
          renderPage();
        }
      }

      async function register() {
        const button = document.getElementById("registerButton");
        if (!button) return;

        button.disabled = true;
        button.textContent = "REGISTERING...";

        try {
          const { error } = await client.rpc("register_for_event", {
            _event_id: eventId
          });

          if (error) throw error;

          showMessage("You're on the list. Welcome to the Cornhouse!", "success");

          await loadPlayer();
          renderPage();
        } catch (error) {
          showMessage("Registration didn't go through: " + error.message, "error");
          button.disabled = false;
          button.textContent = "REGISTER FOR THIS EVENT";
        }
      }

      async function cancel() {
        if (!attendance?.id) return;
        if (!confirm("Cancel your registration for this event?")) return;

        const button = document.getElementById("cancelButton");
        button.disabled = true;
        button.textContent = "CANCELLING...";

        try {
          const { error } = await client.rpc("cancel_event_registration", {
            _attendance_id: attendance.id
          });

          if (error) throw error;

          showMessage("Your registration has been cancelled.", "success");

          await loadPlayer();
          renderPage();
        } catch (error) {
          showMessage("We couldn't cancel your registration: " + error.message, "error");
          button.disabled = false;
          button.textContent = "CANCEL REGISTRATION";
        }
      }

      async function initialize() {
        if (!config?.SUPABASE_URL || !config?.SUPABASE_ANON_KEY) {
          content.textContent = "Supabase configuration is missing.";
          return;
        }

        if (!eventId) {
          content.textContent = "No event was selected. Return to the Event Board to choose an event.";
          return;
        }

        client = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );

        try {
          await loadEvent();
          await loadPlayer();
          renderPage();

          client.auth.onAuthStateChange((_event, session) => {
            currentUser = session?.user || null;

            setTimeout(async () => {
              try {
                await loadPlayer();
                renderPage();
              } catch (error) {
                showMessage(error.message, "error");
              }
            }, 0);
          });
        } catch (error) {
          content.className = "hub-loading";
          content.textContent = "Couldn't load this event: " + error.message;
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
